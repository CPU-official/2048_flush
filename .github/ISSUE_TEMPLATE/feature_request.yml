name: 기능 요청
description: 새 기능이나 개선을 제안합니다
title: "[Feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: background
    attributes:
      label: 배경 / 문제
      description: 왜 필요한가요? 지금 어떤 불편이 있나요?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안 내용
      description: 원하는 동작을 구체적으로 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 검토한 대안
      description: (선택)
  - type: textarea
    id: scope
    attributes:
      label: 범위
      description: 이번에 포함하는 것과 제외하는 것을 구분해 주세요.
      placeholder: |
        포함:
        - ...
        제외:
        - ...
  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
