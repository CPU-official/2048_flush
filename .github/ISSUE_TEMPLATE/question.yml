name: 질문 / 논의
description: 코드 변경 없이 결정하거나 확인할 사항을 남깁니다
title: "[Question] "
labels: ["question"]
body:
  - type: textarea
    id: question
    attributes:
      label: 질문 / 논의 주제
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 배경
      description: 관련 코드, 링크, 이전 논의
  - type: textarea
    id: options
    attributes:
      label: 선택지
      description: 결정이 필요한 경우 후보와 장단점 (선택)
