name: 보안 이슈
description: 보안 관련 개선·점검 작업을 등록합니다 (취약점 상세는 쓰지 마세요)
title: "[Security] "
labels: ["security"]
body:
  - type: markdown
    attributes:
      value: |
        **공개 이슈에 취약점 재현 방법, 키, 토큰을 적지 마세요.**
        악용 가능한 취약점은 `SECURITY.md`의 비공개 신고 절차를 따라 주세요.
  - type: textarea
    id: summary
    attributes:
      label: 요약
      description: 상세한 공격 방법 없이 어떤 종류의 문제인지만 적어 주세요.
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: 심각도
      options:
        - Critical
        - High
        - Medium
        - Low
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 영향 범위
      description: 관련 모듈, 의존성, 데이터
  - type: textarea
    id: done
    attributes:
      label: 완료 조건
    validations:
      required: true
